<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Document Gallery</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  background: #e9ecef;
  margin: 0;
  padding: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 100%;
  max-width: 800px;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,.1);
  text-align: center;
}
.top-header {
  background: linear-gradient(90deg,#0099cc,#8BC34A);
  color: white;
  padding: 15px;
  border-radius: 6px;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.top-header img {
  width: 50px;
  height: 50px;
  object-fit: contain;
}
.header-text { flex: 1; text-align: center; line-height: 1.4em; }
.header-text .bangla { font-size: 1.2em; font-weight: bold; }
.status { text-align: right; margin: 5px 15px 15px 0; }
.status .label {
  font-size: .85em;
  font-weight: bold;
  color: #333;
  display: inline-block;
  padding: 5px 10px;
  background: #f0f4f8;
  border-radius: 6px;
}
.status .value {
  font-size: 1.05em;
  font-weight: bold;
  color: #287d35;
  display: block;
  margin-top: 4px;
}
.flip-wrapper {
  perspective: 1000px;
  max-width: 500px;
  margin: auto;
  background: #f0f4f8;
  border-radius: 12px;
  padding: 10px;
}
.flip-card {
  width: 100%;
  height: 300px;
  transform-style: preserve-3d;
  transition: transform .6s;
  position: relative;
  cursor: pointer;
}
.flip-card.flipped { transform: rotateY(180deg); }
.flip-card .front, .flip-card .back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}
.flip-card .back { transform: rotateY(180deg); }
.flip-card img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 10px;
  border: 1px solid #ddd;
  object-fit: contain;
  box-shadow: 0 4px 10px rgba(0,0,0,.15);
}
.download-btn {
  margin: 20px 5px 5px;
  padding: 10px 20px;
  background: #ff5722;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1em;
}
.footer { margin-top: 20px; font-size: .85em; color: #888; }
.notice { color: #666; font-size: .85em; margin-top: 10px; }
#print-area { display: none; }
#print-area img {
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
  border: 1px solid #ddd;
  display: block;
}
@media print {
  body { background: white !important; padding: 0; }
  .download-btn, .footer, .top-header, .flip-wrapper, .status, .notice {
    display: none !important;
  }
  #print-area { display: block !important; text-align: center; }
}
</style>
</head>
<body>
<div class="container">
  <div class="top-header">
    <img src="logo-left.png" alt="Logo left">
    <div class="header-text">
      <div class="bangla">ব্যক্তিগত ডকুমেন্ট গ্যালারি</div>
      <div>Personal Document Gallery</div>
    </div>
    <img src="logo-right.png" alt="Logo right">
  </div>

  <div class="status">
    <span class="label">Document Status</span>
    <span class="value" id="statusValue">Available</span>
  </div>

  <div class="flip-wrapper" id="viewer">
    <div class="flip-card" id="flipCard">
      <div class="front"><img id="frontImage" alt="Document front"></div>
      <div class="back"><img id="backImage" alt="Document back"></div>
    </div>
  </div>

  <div id="notFound" hidden>
    <h3>ডকুমেন্ট পাওয়া যায়নি</h3>
    <p>লিংকের সংকেতটি সঠিক কি না যাচাই করুন।</p>
  </div>

  <button class="download-btn" id="downloadBtn" type="button">Print / Save as PDF</button>

  <div id="print-area">
    <img id="printFront" alt="Document front">
    <img id="printBack" alt="Document back">
  </div>

  <div class="notice">ব্যক্তিগত ডকুমেন্ট প্রদর্শনের নমুনা — এটি কোনো সরকারি যাচাইকরণ সেবা নয়।</div>
  <div class="footer">Personal Document Gallery</div>
</div>

<script>
// নতুন ব্যক্তির ছবি যোগ করতে নিচের তালিকায় নতুন সংকেত লিখুন।
const documents = {
  // আগের QR-এর মূল লিংক অপরিবর্তিত রাখতে প্রথম ব্যক্তিকে ডিফল্ট রাখা হয়েছে।
  "K7P9X": {
    front: "person1-front.jpg",
    back: "person1-back.jpg"
  },
  "M4T8Q": {
    front: "person2-front.jpg",
    back: "person2-back.jpg"
  }
};

const params = new URLSearchParams(window.location.search);
const code = params.get("ref") || "K7P9X";
const person = documents[code];

if (person) {
  document.getElementById("frontImage").src = person.front;
  document.getElementById("backImage").src = person.back;
  document.getElementById("printFront").src = person.front;
  document.getElementById("printBack").src = person.back;
} else {
  document.getElementById("viewer").hidden = true;
  document.getElementById("notFound").hidden = false;
  document.getElementById("statusValue").textContent = "Not found";
  document.getElementById("statusValue").style.color = "#b00020";
}

document.getElementById("flipCard").addEventListener("click", function () {
  this.classList.toggle("flipped");
});

document.getElementById("downloadBtn").addEventListener("click", function () {
  window.print();
});
</script>
</body>
</html>
